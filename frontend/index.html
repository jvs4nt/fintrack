<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>FinTrack — Organizador Financeiro</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        /* Cores da identidade dark finance */
        --bg-primary: #0a0a0f;
        --bg-secondary: #111118;
        --bg-tertiary: #1a1a24;
        --border: #2a2a38;
        --accent-primary: #00e5a0;
        --accent-danger: #ff4d6d;
        --accent-warning: #ffc107;
        --text-primary: #e8e8f0;
        --text-secondary: #7a7a9a;

        /* Fontes */
        --font-display: 'DM Mono', monospace;
        --font-ui: 'Sora', sans-serif;
      }

      body {
        font-family: var(--font-ui);
        background-color: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
      }

      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
